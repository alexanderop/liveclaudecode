<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Run — Live</title>
<link rel="stylesheet" href="/static/app.css"></head>
<body>
<aside>
  <header>
    <h1>Runs</h1>
    <input id="q" placeholder="filter runs…">
    <div class="filters">
      <label class="tg" style="font:10.5px var(--mono);color:var(--dim)"><input type="checkbox" id="liveOnly"> live only</label>
      <label class="tg" style="font:10.5px var(--mono);color:var(--dim)"><input type="checkbox" id="hideIdle" checked> hide empty</label>
    </div>
  </header>
  <div id="tree"></div>
</aside>
<main>
  <div id="hero">
    <div class="top">
      <span class="dot" id="hdot"></span>
      <h2 id="htitle">Pick a run</h2>
      <span class="pill done" id="hpill">—</span>
      <span style="flex:1"></span>
      <label class="tg" style="font:11px var(--mono);color:var(--dim)"><input type="checkbox" id="autojump" checked> follow the active agent</label>
    </div>
    <div id="say">—</div>
    <div id="kpis"></div>
  </div>
  <div id="panels">
    <details class="pnl" id="pTimeline" open><summary>Agent timeline <span id="tlNote" style="text-transform:none;letter-spacing:0;color:var(--faint)"></span></summary><div class="pbody" id="gantt"></div></details>
    <details class="pnl" id="pPlan" open><summary>Plan &amp; phases</summary><div class="pbody" id="plan"></div></details>
    <details class="pnl" id="pWork"><summary>What it changed <span id="workNote" style="text-transform:none;letter-spacing:0;color:var(--faint)"></span></summary><div class="pbody cols" id="work"></div></details>
  </div>
  <div id="ctl">
    <span id="viewing" style="color:var(--dim)">—</span>
    <span style="flex:1"></span>
    <span>detail</span>
    <div class="seg" id="density">
      <button data-d="compact">compact</button><button data-d="normal" class="on">normal</button><button data-d="raw">raw</button>
    </div>
    <label class="tg"><input type="checkbox" id="follow" checked> follow output</label>
    <label class="tg"><input type="checkbox" id="errOnly"> errors only</label>
    <span id="feedNote" style="color:var(--faint)"></span>
  </div>
  <div id="feed"><div id="empty">Pick a run on the left. Green pulse = still writing.</div></div>
</main>
<script src="/static/app.js"></script>
</body></html>
