[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liveclaudecode"
version = "0.1.0"
description = "Live web view of a running Claude Code session and its subagents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alexander Opalic" }]
keywords = ["claude", "claude-code", "agents", "observability", "jsonl"]
dependencies = []

[project.urls]
Homepage = "https://github.com/alexanderopalic/liveclaudecode"

[project.scripts]
liveclaudecode = "liveclaudecode.cli:main"
lcc = "liveclaudecode.cli:main"

[tool.setuptools]
packages = ["liveclaudecode"]

[tool.setuptools.package-data]
liveclaudecode = ["static/*"]
